name: Auxiliary Go reference CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go Format and Vet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reference quality and infrastructure
        run: bash scripts/ci/run.sh linux-amd64 quality quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-results
          path: build/ci-results/

  go-linux:
    name: Supplementary Go Tests / Linux
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full repository tests
        run: bash scripts/ci/run.sh linux-amd64 go-reference full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-reference-results
          path: build/ci-results/

  native-aot:
    if: github.event_name != 'pull_request'
    name: Apple Silicon / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [aot, aot-race, full, bootstrap, native-fixed-point]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Fixed-point verification checks the CI baseline ancestor.
      - name: Check ARM64
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native AOT tests
        if: matrix.suite == 'aot'
        run: bash scripts/ci/run.sh macos-arm64 go-aot-reference full
      - name: Native AOT race tests
        if: matrix.suite == 'aot-race'
        run: bash scripts/ci/run.sh macos-arm64 go-aot-reference race
      - name: Full supplementary reference regression
        if: matrix.suite == 'full'
        run: bash scripts/ci/run.sh macos-arm64 go-reference full
      - name: Native bootstrap B-C-D fixed point and M17 golden artifacts
        if: matrix.suite == 'bootstrap'
        run: bash scripts/ci/run.sh macos-arm64 legacy-bootstrap bootstrap
      - name: M18 pure Mio Native AOT machine-code fixed point
        if: matrix.suite == 'native-fixed-point'
        run: bash scripts/ci/run.sh macos-arm64 legacy-bootstrap fixed-point
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-${{ matrix.suite }}-results
          path: build/ci-results/
      - name: Upload M18 provenance and native generations
        if: always() && matrix.suite == 'native-fixed-point'
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-machine-code-fixed-point
          path: build/m18-ci/
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified bootstrap artifacts
        if: success() && matrix.suite == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: native-bootstrap-golden
          path: |
            build/compiler-A.mochi
            build/compiler-B-native.mochi
            build/native-bootstrap/compiler-C.mochi
            build/native-bootstrap/compiler-D.mochi
            build/native-bootstrap-check.*/SHA256SUMS
            build/native-bootstrap-check.*/m17-golden.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-diagnostics-${{ matrix.suite }}
          path: |
            build/*.telemetry
            build/*audit.json
            build/*.sample.txt
          if-no-files-found: ignore
          retention-days: 7
