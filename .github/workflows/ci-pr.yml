name: Mio CI V2 / Quick
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    name: CI infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/ci/runner.py inventory
      - run: bash scripts/ci/selftest.sh
  quick:
    name: Quick / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: '["ubuntu-24.04"]'
          - target: macos-arm64
            runner: '["self-hosted", "macOS", "ARM64", "mio-native"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    concurrency:
      group: ci-resource-${{ matrix.target }}-${{ matrix.target == 'macos-arm64' && 'shared' || github.run_id }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 180
    env:
      MIO_CI_RESULTS: build/ci-results/run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # This repository has no go.sum.
      - run: bash scripts/ci/run.sh ${{ matrix.target }} all quick
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-${{ matrix.target }}
          path: ${{ env.MIO_CI_RESULTS }}/
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Mio CI / required
    if: always()
    needs: [infrastructure, quick]
    runs-on: ubuntu-24.04
    steps:
      - name: Require infrastructure and both platform jobs
        env:
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          QUICK: ${{ needs.quick.result }}
        run: |
          test "$INFRASTRUCTURE" = success
          test "$QUICK" = success
